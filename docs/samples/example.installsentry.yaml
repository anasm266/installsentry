version: 1

ci:
  policy: balanced
  allowHosts:
    - registry.npmjs.org
  denyHosts:
    - example.com
  failOn:
    - secret-canary
    - denied-network

runner:
  mode: host
  dockerImage: node:20-bookworm-slim
  dockerNetwork: default

report:
  output: installsentry-report.html
  format: both
  sarif: installsentry.sarif

baseline:
  path: .installsentry/baseline.json
